[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcmc-supernovae-lib"
version = "0.1.0"
description = "Cosmology + Bayesian MCMC library for the Union2.1 supernova analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["lib"]
